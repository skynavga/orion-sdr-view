name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Fast check ─────────────────────────────────────────────────────────────
  check:
    name: Check / fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The `gui` feature builds the eframe/winit/wgpu stack.  Its only
      # build-time system dependency on Linux is libwayland-dev: wayland-sys's
      # build script runs `pkg-config --probe wayland-{client,cursor,egl}`.
      # X11 (x11rb/x11-dl) and xkbcommon (xkbcommon-dl) are dlopen/pure-rust,
      # so they need nothing at compile time and no display is required.
      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-

      - run: cargo fmt --check
      - run: cargo check --no-default-features
      - run: cargo clippy --no-default-features --tests -- -D warnings
      - run: cargo check --features gui
      - run: cargo clippy --features gui -- -D warnings

  # ── Rust tests ─────────────────────────────────────────────────────────────
  test:
    name: Test (stable + beta)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      # Needed by the `gui` test run below; see the note in the check job.
      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev

      - name: Install ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-${{ matrix.toolchain }}-

      - name: Run tests
        run: cargo test --no-default-features --release

      # The app layer lives behind `gui`, so the headless `ViewApp` tests
      # (tests/app.rs, tests/panes.rs, tests/script.rs) are compiled out of the
      # run above entirely.  Without this step they would never execute in CI —
      # the same gap that left the GUI uncompiled before 0.0.16.  No display or
      # GPU is needed: the harness drives `egui::Context` directly and never
      # opens a window.
      - name: Run tests (gui)
        run: cargo test --features gui --release
