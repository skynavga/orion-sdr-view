[package]
name = "orion-sdr-view"
version = "0.0.28"
edition = "2024"
description = "Keyboard-driven SDR spectrum viewer: live spectrum, persistence, and waterfall display."
license = "MIT OR Apache-2.0"
repository = "https://github.com/skynavga/orion-sdr-view"
readme = "README.md"
keywords = ["sdr", "dsp", "radio", "spectrum", "waterfall"]
categories = ["visualization", "science", "multimedia"]
include = [
    "src/**/*",
    "assets/**/*",
    "scripts/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
name = "orion_sdr_view"
path = "src/lib.rs"

[[bin]]
name = "orion-sdr-view"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]

[dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
], optional = true }
egui = { version = "0.35", optional = true }
num-complex = "0.4"
rustfft = "6"
orion-sdr = "0.0.60"
hound = "3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# The replay driver's dump format.  JSON Lines rather than CSV because every
# instrument reading is an `Option`: a CSV column cannot hold `null` without a
# sentinel, and any sentinel reintroduces the "absent reading rendered as zero"
# bug the `Option` exists to prevent.
serde_json = "1"
# Still capture.  A real deflate encoder rather than a hand-rolled stored-block
# PNG: a 2400x1656 readback is 15.9 MB raw, and every screenshot arriving at
# that size would make the feature unpleasant to use.  Small and pure Rust —
# the same judgement as piping video to ffmpeg rather than linking a codec.
png = "0.18"

[dev-dependencies]
tempfile = "3"
# The GPU oracle in `tests/raster_oracle.rs`, which renders the same primitives
# through the real pipeline and compares them against the CPU rasterizer.  Dev
# dependencies rather than real ones: nothing ships with this, and both crates
# are already in the tree via eframe, so it costs no extra compilation.
wgpu = "29"
egui-wgpu = "0.35"
pollster = "0.4"
